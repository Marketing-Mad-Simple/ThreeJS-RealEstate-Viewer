<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Convention Navigator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <canvas id="canvas"></canvas>

  <!-- Loading -->
  <div id="loading-overlay">
    <div class="loading-brand">Convention<span>Navigator</span></div>
    <div class="loading-sub" id="loading-text">Initialising…</div>
    <div class="progress-track"><div id="progress-bar"></div></div>
  </div>

  <!-- Header bar (desktop only, hidden on mobile) -->
  <header id="header">
    <div class="brand">Convention<span>Navigator</span></div>
    <div class="header-right">
      <div id="stat-total"  class="header-pill">— stalls</div>
      <div id="stat-mapped" class="header-pill mapped">— mapped</div>
    </div>
  </header>

  <!-- ── DESKTOP side panel ─────────────────────────────────── -->
  <div id="side-panel">
    <div class="tabs">
      <button class="tab-btn active" data-tab="browse-pane" id="browse-tab">🗺 Browse</button>
      <button class="tab-btn"        data-tab="route-pane"  id="route-tab">🧭 Navigate</button>
    </div>

    <!-- Browse -->
    <div id="browse-pane" class="tab-pane active">
      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="Search stall or company…" autocomplete="off" />
      </div>
      <div id="stall-list"></div>
    </div>

    <!-- Navigate (desktop) -->
    <div id="route-pane" class="tab-pane">
      <div class="route-search-card">
        <!-- From -->
        <div class="rs-row">
          <div class="rs-dot rs-dot-start"></div>
          <div class="rs-field-wrap">
            <input id="ds-from-input" class="rs-input" type="text"
                   placeholder="From — stall or company" autocomplete="off" />
            <div id="ds-from-dropdown" class="rs-dropdown"></div>
          </div>
          <button class="rs-clear-btn" id="ds-from-clear" title="Clear">✕</button>
        </div>
        <div class="rs-divider"></div>
        <!-- To -->
        <div class="rs-row">
          <div class="rs-dot rs-dot-end"></div>
          <div class="rs-field-wrap">
            <input id="ds-to-input" class="rs-input" type="text"
                   placeholder="To — stall or company" autocomplete="off" />
            <div id="ds-to-dropdown" class="rs-dropdown"></div>
          </div>
          <button class="rs-clear-btn" id="ds-to-clear" title="Clear">✕</button>
        </div>
      </div>

      <div id="route-hint" class="route-hint">Search or tap a stall to begin</div>

      <div id="route-steps-wrap">
        <div class="route-steps-label">Route</div>
        <div id="route-steps"></div>
      </div>

      <button id="btn-clear-route">✕ Clear route</button>
      <button id="btn-start-nav" onclick="window._startPDR()">🚶 Start Navigation</button>
    </div>
  </div>

  <!-- ── MOBILE bottom sheet ────────────────────────────────── -->
  <div id="mobile-sheet">
    <!-- Drag handle -->
    <div id="sheet-handle-bar" class="sheet-handle-bar">
      <div class="handle-pill"></div>
    </div>

    <!-- Collapsed state — just the two search inputs visible -->
    <div id="sheet-search">
      <!-- From row -->
      <div class="ms-row">
        <div class="ms-dot ms-dot-start"></div>
        <div class="ms-field-wrap">
          <input id="ms-from-input" class="ms-input" type="text"
                 placeholder="From — stall or company" autocomplete="off" />
          <div id="ms-from-dropdown" class="ms-dropdown"></div>
        </div>
        <button class="ms-clear-btn" id="ms-from-clear">✕</button>
      </div>
      <div class="ms-divider"></div>
      <!-- To row -->
      <div class="ms-row">
        <div class="ms-dot ms-dot-end"></div>
        <div class="ms-field-wrap">
          <input id="ms-to-input" class="ms-input" type="text"
                 placeholder="To — stall or company" autocomplete="off" />
          <div id="ms-to-dropdown" class="ms-dropdown"></div>
        </div>
        <button class="ms-clear-btn" id="ms-to-clear">✕</button>
      </div>
    </div>

    <!-- Expandable content -->
    <div id="sheet-body">
      <div id="ms-route-hint" class="ms-hint">Search or tap a stall on the map</div>
      <div id="ms-route-steps"></div>
    </div>

    <!-- Browse list (when no route active) -->
    <div id="ms-browse">
      <input id="ms-browse-input" class="ms-input" type="text"
             placeholder="🔍 Search all stalls…" autocomplete="off" />
      <div id="ms-stall-list"></div>
    </div>
  </div>

  <!-- Camera controls (always floating) -->
  <div id="controls-panel">
    <button class="ctrl-btn" id="btn-reset-cam" title="Reset camera">⌂</button>
    <button class="ctrl-btn" onclick="window._topView && window._topView()" title="Top view">⊙</button>
  </div>

  <!-- ── PDR Navigation HUD ─────────────────────────────────────────── -->
  <div id="pdr-hud">
    <!-- Top bar: compass + destination -->
    <div id="pdr-top-bar">
      <div id="pdr-compass">
        <div id="pdr-compass-arrow">↑</div>
      </div>
      <div id="pdr-dest-info">
        <div class="pdr-label">Navigating to</div>
        <div id="pdr-to" class="pdr-dest-name">—</div>
      </div>
      <button id="pdr-stop-btn" onclick="window._stopPDR()">✕</button>
    </div>

    <!-- Turn instruction card -->
    <div id="pdr-instruction-card">
      <div id="pdr-instruction" class="pdr-instruction-text">Calculating…</div>
      <div id="pdr-distance" class="pdr-distance-text"></div>
    </div>

    <!-- Bottom: track camera toggle + correction button -->
    <div id="pdr-bottom-bar">
      <button class="pdr-action-btn" onclick="window._showCorrectionModal()">
        📍 Where am I?
      </button>
      <button class="pdr-action-btn" id="pdr-track-btn"
        onclick="window._toggleTrack && window._toggleTrack()">
        🎯 Track me
      </button>
    </div>
  </div>

  <!-- Drift warning toast -->
  <div id="pdr-drift-warning">
    <span>⚠ Position uncertain</span>
    <button onclick="window._showCorrectionModal()">Correct</button>
  </div>

  <!-- Manual correction modal -->
  <div id="pdr-correction-modal">
    <div id="pdr-correction-sheet">
      <div class="pdr-modal-header">
        <span>📍 Where are you now?</span>
        <button onclick="document.getElementById('pdr-correction-modal').style.display='none'">✕</button>
      </div>
      <input id="pdr-correction-search" class="pdr-search" type="text"
             placeholder="Search stall or company…"
             oninput="window._showCorrectionModal()" />
      <div id="pdr-correction-list"></div>
    </div>
  </div>

  <!-- Tooltip (desktop hover) -->
  <div id="tooltip"></div>

  <!-- Stall popup -->
  <div id="stall-popup"></div>

  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./js/viewer.js"></script>

  <script>
    window.onSceneReady = function () {
      const ov = document.getElementById('loading-overlay');
      ov.style.opacity = '0';
      setTimeout(() => ov.style.display = 'none', 600);
    };
  </script>
</body>
</html>
