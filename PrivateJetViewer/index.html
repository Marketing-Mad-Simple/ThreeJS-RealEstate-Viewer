<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether — Private Jet Configurator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <!-- Canvas -->
  <canvas id="canvas"></canvas>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="loading-brand">
      <span class="brand-word">AETHER</span>
      <span class="brand-line"></span>
      <span class="brand-sub">Private Aviation</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-track">
        <div id="progress-bar"></div>
      </div>
      <div id="loading-text">Preparing experience…</div>
    </div>
  </div>

  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <div class="brand">AETHER<span class="brand-dot">.</span></div>
    </div>
    <div class="header-center" id="jet-title">Gulfstream G700</div>
    <div class="header-right">
      <button class="ctrl-btn" id="btn-reset" title="Reset Camera">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-fullscreen" title="Fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
  </header>

  <!-- View Toggle (Exterior / Interior) -->
  <div id="view-toggle">
    <button class="view-btn active" data-view="exterior">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      Exterior
    </button>
    <button class="view-btn" data-view="interior">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M3 9h6"/><path d="M3 15h6"/></svg>
      Interior
    </button>
  </div>

  <!-- Configurator Panel -->
  <div id="config-panel">
    <div class="panel-header">
      <div class="panel-title">Configuration</div>
      <button class="panel-toggle" id="panel-toggle-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
    </div>

    <div class="panel-body" id="panel-body">

      <!-- EXTERIOR OPTIONS -->
      <div class="config-section" id="section-exterior">
        <div class="section-label">Exterior Finish</div>

        <div class="config-row">
          <label class="config-label">Paint Color</label>
          <div class="swatch-row" id="swatches-paint">
            <button class="swatch active" data-group="paint" data-value="pearl_white" style="background:#F0EEE9;" title="Pearl White"></button>
            <button class="swatch" data-group="paint" data-value="midnight_black" style="background:#1A1A1E;" title="Midnight Black"></button>
            <button class="swatch" data-group="paint" data-value="champagne_gold" style="background:#C8A96E;" title="Champagne Gold"></button>
            <button class="swatch" data-group="paint" data-value="navy_eclipse" style="background:#1C2B4A;" title="Navy Eclipse"></button>
            <button class="swatch" data-group="paint" data-value="silver_mist" style="background:#A8AEBA;" title="Silver Mist"></button>
            <button class="swatch" data-group="paint" data-value="obsidian_red" style="background:#6B1E22;" title="Obsidian Red"></button>
          </div>
          <div class="swatch-label" id="label-paint">Pearl White</div>
        </div>

        <div class="config-row">
          <label class="config-label">Accent Stripe</label>
          <div class="swatch-row" id="swatches-stripe">
            <button class="swatch active" data-group="stripe" data-value="none" style="background:transparent;border:1px dashed #555;" title="None"><span style="color:#888;font-size:9px;line-height:1;display:block;text-align:center;padding-top:5px;">∅</span></button>
            <button class="swatch" data-group="stripe" data-value="gold" style="background:#C8A96E;" title="Gold"></button>
            <button class="swatch" data-group="stripe" data-value="silver" style="background:#C0C4CC;" title="Silver"></button>
            <button class="swatch" data-group="stripe" data-value="carbon" style="background:#2A2A2A;" title="Carbon"></button>
          </div>
          <div class="swatch-label" id="label-stripe">None</div>
        </div>

        <div class="config-row">
          <label class="config-label">Finish Type</label>
          <div class="option-pills" id="pills-finish">
            <button class="option-pill active" data-group="finish" data-value="gloss">Gloss</button>
            <button class="option-pill" data-group="finish" data-value="matte">Matte</button>
            <button class="option-pill" data-group="finish" data-value="satin">Satin</button>
          </div>
        </div>
      </div>

      <!-- INTERIOR OPTIONS -->
      <div class="config-section hidden" id="section-interior">
        <div class="section-label">Interior Design</div>

        <div class="config-row">
          <label class="config-label">Seat Material</label>
          <div class="option-pills" id="pills-seat-material">
            <button class="option-pill active" data-group="seat_material" data-value="leather">Full Leather</button>
            <button class="option-pill" data-group="seat_material" data-value="alcantara">Alcantara</button>
            <button class="option-pill" data-group="seat_material" data-value="fabric">Fine Fabric</button>
          </div>
        </div>

        <div class="config-row">
          <label class="config-label">Seat Color</label>
          <div class="swatch-row" id="swatches-seat-color">
            <button class="swatch active" data-group="seat_color" data-value="ivory" style="background:#E8E0D0;" title="Ivory"></button>
            <button class="swatch" data-group="seat_color" data-value="cognac" style="background:#8B5E3C;" title="Cognac"></button>
            <button class="swatch" data-group="seat_color" data-value="charcoal" style="background:#3A3A3A;" title="Charcoal"></button>
            <button class="swatch" data-group="seat_color" data-value="cream" style="background:#F5EDD8;" title="Warm Cream"></button>
            <button class="swatch" data-group="seat_color" data-value="navy" style="background:#1C2B4A;" title="Deep Navy"></button>
          </div>
          <div class="swatch-label" id="label-seat-color">Ivory</div>
        </div>

        <div class="config-row">
          <label class="config-label">Wood Trim</label>
          <div class="swatch-row" id="swatches-wood">
            <button class="swatch active" data-group="wood" data-value="walnut" style="background:#5C3D1E;" title="Walnut"></button>
            <button class="swatch" data-group="wood" data-value="maple" style="background:#C8A882;" title="Maple Burl"></button>
            <button class="swatch" data-group="wood" data-value="ebony" style="background:#1A1208;" title="Ebony"></button>
            <button class="swatch" data-group="wood" data-value="carbon" style="background:#222228;" title="Carbon Fibre"></button>
          </div>
          <div class="swatch-label" id="label-wood">Walnut</div>
        </div>

        <div class="config-row">
          <label class="config-label">Ambient Lighting</label>
          <div class="swatch-row" id="swatches-lighting">
            <button class="swatch active" data-group="lighting" data-value="warm" style="background:#F4C77A;" title="Warm White"></button>
            <button class="swatch" data-group="lighting" data-value="cool" style="background:#D0E8FF;" title="Cool White"></button>
            <button class="swatch" data-group="lighting" data-value="rose" style="background:#FFD0D8;" title="Rose Blush"></button>
            <button class="swatch" data-group="lighting" data-value="blue" style="background:#A0C8FF;" title="Midnight Blue"></button>
          </div>
          <div class="swatch-label" id="label-lighting">Warm White</div>
        </div>

        <div class="config-row">
          <label class="config-label">Interior Style</label>
          <div class="option-pills" id="pills-style">
            <button class="option-pill active" data-group="interior_style" data-value="classic">Classic</button>
            <button class="option-pill" data-group="interior_style" data-value="modern">Modern</button>
            <button class="option-pill" data-group="interior_style" data-value="sport">Sport</button>
          </div>
        </div>
      </div>

      <!-- Summary footer -->
      <div class="panel-footer">
        <button class="request-btn" id="btn-request">Request a Quote</button>
      </div>

    </div>
  </div>

  <!-- Hotspot hints (shown over canvas) -->
  <div id="hint-bar">
    <span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Drag to orbit &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Right-drag to pan
    </span>
  </div>

  <!-- Toast notification -->
  <div id="toast"></div>

  <!-- Three.js import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./js/viewer.js"></script>
</body>
</html>
