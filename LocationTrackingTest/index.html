<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Convention Navigator</title>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<!-- ── Loading ────────────────────────────────────────────────── -->
<div id="loading">
  <h1>Convention Navigator</h1>
  <div id="loadBar"><div id="loadFill"></div></div>
  <p id="loadMsg">Loading scene…</p>
</div>

<!-- ── Three canvas ───────────────────────────────────────────── -->
<canvas id="three-canvas"></canvas>

<!-- ── Top bar ────────────────────────────────────────────────── -->
<div id="topBar">
  <div class="logo">ConvNav</div>
  <div id="searchWrap">
    <span id="searchIcon">🔍</span>
    <input id="searchInput" type="text" placeholder="Search stall or company…" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button id="clearSearch">✕</button>
  </div>
</div>

<!-- ── Search results ─────────────────────────────────────────── -->
<div id="searchResults"></div>

<!-- ── Destination bar ────────────────────────────────────────── -->
<div id="destBar" style="display:none;position:fixed;top:60px;left:10px;right:10px;z-index:91;
  background:rgba(29,158,117,.2);border:1px solid rgba(29,158,117,.4);border-radius:10px;
  padding:8px 12px;font-size:13px;color:#fff;flex-direction:row;
  justify-content:space-between;align-items:center;gap:8px;">
  <span style="font-size:16px">🧭</span>
  <span class="dest-name" id="destName" style="flex:1;font-weight:600;font-size:13px"></span>
  <span class="dest-dist" id="destDist" style="color:#5eefc0;font-size:12px;white-space:nowrap"></span>
  <button id="destClear" style="background:none;border:none;color:#E24B4A;font-size:20px;cursor:pointer;padding:0 4px">✕</button>
</div>

<!-- ── Stall list panel ────────────────────────────────────────── -->
<div id="navPanel">
  <button id="navPanelClose">✕</button>
  <h3>All Stalls</h3>
  <div id="navContent"></div>
</div>

<!-- ── Floating buttons ───────────────────────────────────────── -->
<button id="recenterBtn" onclick="camFollowing=true">⊙ Follow</button>
<div id="compass">⬆</div>
<button id="navToggleBtn">☰ Stalls</button>
<div id="errBox"></div>

<!-- ── Bottom HUD ─────────────────────────────────────────────── -->
<div id="hud">
  <div class="pills">
    <div class="pill good"><span class="dot"></span>Kalman heading</div>
    <div class="pill" id="gpsPill"><span class="dot"></span><span id="gpsLabel">GPS: —</span></div>
    <div class="pill" id="navmeshPill"><span class="dot" style="background:#555"></span>
      <span id="navmeshLabel">Navmesh: loading</span></div>
  </div>

  <div id="speedBar"><div id="speedFill"></div></div>

  <div class="stats">
    <div>Heading: <span id="hdg">—</span>°</div>
    <div>Steps: <span id="stepCount">0</span></div>
    <div>Pos: <span id="pos">0, 0</span></div>
    <div>Status: <span id="status">loading…</span></div>
  </div>

  <div class="slider-row">
    <span>Step length</span>
    <input type="range" min="0.005" max="0.12" step="0.005" value="0.025"
      oninput="window.STEP_LENGTH=parseFloat(this.value);document.getElementById('slVal').textContent=parseFloat(this.value).toFixed(3)+'m'">
    <span id="slVal">0.025m</span>
  </div>
  <div class="slider-row">
    <span>Threshold</span>
    <input type="range" min="0.3" max="4.0" step="0.1" value="1.2"
      oninput="window.STEP_THRESH=parseFloat(this.value);document.getElementById('thVal').textContent=this.value">
    <span id="thVal">1.2</span>
    <span style="color:#555;font-size:11px">raise to filter in-place</span>
  </div>

  <div class="hud-row">
    <button class="btn btn-primary" id="startBtn" onclick="requestAndStart()">Start tracking</button>
    <button class="btn btn-primary" id="moveBtn"  onclick="toggleMove()"   style="display:none">Walking: OFF</button>
    <button class="btn btn-primary" id="gpsBtn"   onclick="toggleGPS()"   style="display:none">GPS: ON</button>
    <button class="btn btn-danger"  id="resetBtn" onclick="resetTracking()" style="display:none">Reset</button>
  </div>
</div>

<!-- ── Libraries ──────────────────────────────────────────────── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

<!-- ── App scripts (order matters) ───────────────────────────── -->
<script src="js/stalls.js"></script>
<script src="js/scene.js"></script>
<script src="js/labels.js"></script>
<script src="js/nav.js"></script>
<script src="js/sensors.js"></script>

<!-- ── GLB Loader + CSS2D bootstrap ──────────────────────────── -->
<script>
// CSS2D renderer — overlays DOM labels on Three.js canvas
const css2d = new THREE.CSS2DRenderer();
css2d.setSize(window.innerWidth, window.innerHeight);
css2d.domElement.style.cssText='position:fixed;top:0;left:0;pointer-events:none;z-index:10';
document.body.appendChild(css2d.domElement);
window.addEventListener('resize',()=>css2d.setSize(window.innerWidth,window.innerHeight));

// Patch animate to also render CSS2D
const _origRender=renderer.render.bind(renderer);
renderer.render=function(s,c){ _origRender(s,c); css2d.render(s,c); };

// Init labels after stall data available
initLabels(css2d);

// Load GLB
function setLoad(p,m){
  document.getElementById('loadFill').style.width=p+'%';
  document.getElementById('loadMsg').textContent=m;
}

new THREE.GLTFLoader().load('models/site.glb', gltf=>{
  setLoad(90,'Building navmesh…');
  gltf.scene.traverse(obj=>{
    if(!obj.isMesh)return;
    obj.castShadow=obj.receiveShadow=true;
    if(obj.name==='NAV_MESH') obj.visible=false;
  });
  scene.add(gltf.scene);
  gltf.scene.traverse(obj=>{
    if(!obj.isMesh||obj.name!=='NAV_MESH')return;
    obj.updateWorldMatrix(true,false);
    buildNavmesh(obj);
    document.getElementById('navmeshLabel').textContent=`Navmesh: ${navTriangles.length} tris`;
    document.getElementById('navmeshPill').querySelector('.dot').style.background='#1D9E75';
    // Place avatar at aisle center
    const candidates=[[1.86,0.009],[1.5,0.0],[2.0,0.5],[1.8,-0.5],[1.0,0.0]];
    for(const[cx,cz] of candidates){
      const tri=findTri(cx,cz);
      if(tri){placeAvatarImmediate(cx,triY(cx,cz,tri.a,tri.b,tri.c),cz);break;}
    }
  });
  setLoad(100,'Ready!');
  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('status').textContent='tap Start tracking';
  },300);
},
xhr=>{if(xhr.total)setLoad(Math.round(xhr.loaded/xhr.total*85),`Loading… ${(xhr.loaded/1024/1024).toFixed(1)}MB`);},
err=>{
  document.getElementById('loading').style.display='none';
  showErr('Could not load models/site.glb — place it in models/ folder. '+err.message);
});

animate(); // start render loop after all scripts and patches are ready

function showErr(msg){
  const el=document.getElementById('errBox');
  el.textContent=msg;el.style.display='block';
  document.getElementById('status').textContent='error';
  setTimeout(()=>el.style.display='none',8000);
}
</script>
</body>
</html>
