<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Convention Navigator</title>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<!-- ── Loading ────────────────────────────────────────────────── -->
<div id="loading">
  <h1>Convention Navigator</h1>
  <div id="loadBar"><div id="loadFill"></div></div>
  <p id="loadMsg">Loading scene…</p>
</div>

<!-- ── Three canvas ───────────────────────────────────────────── -->
<canvas id="three-canvas"></canvas>

<!-- ── Top bar ────────────────────────────────────────────────── -->
<div id="topBar">
  <div class="logo">ConvNav</div>
  <button id="topCollapseBtn" onclick="toggleTopBar()">▲</button>
</div>

<!-- ── Route planner (Google Maps style) ──────────────────────── -->
<div id="routePlanner">

  <!-- From row -->
  <div class="route-row">
    <div class="route-dot from-dot"></div>
    <div class="route-input-wrap" id="fromWrap">
      <input id="fromInput" type="text" placeholder="From — stall or company"
        autocomplete="off" autocorrect="off" spellcheck="false"
        onfocus="openRoutePicker('from')" readonly/>
      <button class="route-clear-btn" id="fromClear" onclick="clearRoutePoint('from')">✕</button>
    </div>
  </div>

  <!-- Divider line -->
  <div class="route-line-divider">
    <div class="route-vline"></div>
    <button class="route-swap-btn" onclick="swapRoutePoints()" title="Swap">⇅</button>
  </div>

  <!-- To row -->
  <div class="route-row">
    <div class="route-dot to-dot"></div>
    <div class="route-input-wrap" id="toWrap">
      <input id="toInput" type="text" placeholder="To — stall or company"
        autocomplete="off" autocorrect="off" spellcheck="false"
        onfocus="openRoutePicker('to')" readonly/>
      <button class="route-clear-btn" id="toClear" onclick="clearRoutePoint('to')">✕</button>
    </div>
  </div>

  <!-- Start navigation button -->
  <button id="startNavBtn" onclick="startNavigation()" disabled>
    <span>Start Navigation</span>
    <span id="navEta"></span>
  </button>

</div>

<!-- ── Route picker dropdown ──────────────────────────────────── -->
<div id="routePicker">
  <div id="routePickerHeader">
    <input id="routePickerSearch" type="text" placeholder="Search stall or company…"
      autocomplete="off" autocorrect="off" spellcheck="false"
      oninput="filterRoutePicker(this.value)"/>
    <button onclick="closeRoutePicker()">✕</button>
  </div>
  <!-- "My Location" shortcut for From -->
  <div id="myLocationRow" class="picker-item picker-special" onclick="pickMyLocation()">
    <span class="picker-icon">📍</span>
    <span>My current position</span>
  </div>
  <div id="routePickerList"></div>
</div>

<!-- ── Navigation active bar (shown during navigation) ────────── -->
<div id="navActiveBar">
  <div id="navActiveInfo">
    <div id="navActiveName"></div>
    <div id="navActiveDist"></div>
  </div>
  <button id="navActiveStop" onclick="stopNavigation()">✕ Stop</button>
</div>

<!-- ── Search results (kept for stall list panel search) ──────── -->
<div id="searchResults" style="display:none"></div>

<!-- ── Stall list panel ────────────────────────────────────────── -->
<div id="navPanel">
  <div id="navPanelHeader">
    <h3>All Stalls</h3>
    <button id="navPanelClose" onclick="document.getElementById('navPanel').classList.remove('open')">✕</button>
  </div>
  <div id="navContent"></div>
</div>

<!-- ── Floating buttons ───────────────────────────────────────── -->

<!-- ── Arrival overlay ────────────────────────────────────────── -->
<div id="arrivalOverlay">
  <div id="arrivalCard">
    <div id="arrivalIcon">🎯</div>
    <div id="arrivalTitle">You've arrived!</div>
    <div id="arrivalStall"></div>
    <button id="arrivalClose" onclick="dismissArrival()">Done</button>
  </div>
</div>

<div id="errBox"></div>

<!-- ── Bottom HUD ─────────────────────────────────────────────── -->
<div id="hud">
  <div class="hud-row">
    <button class="btn btn-primary" id="startBtn" onclick="requestAndStart()">▶ Start tracking</button>
    <button class="btn btn-active"  id="moveBtn"  onclick="toggleMove()" style="display:none">Walking: ON</button>
    <button class="btn btn-danger"  id="resetBtn" onclick="resetTracking()" style="display:none">Reset</button>
    <button class="btn btn-off"     id="devBtn"   onclick="toggleDevPanel()">⚙</button>
  </div>
  <div id="speedBar"><div id="speedFill"></div></div>
</div>

<!-- ── Dev panel — slides up from bottom ─────────────────────── -->
<div id="devPanel">
  <div id="devPanelHandle" onclick="toggleDevPanel()">
    <div id="devPanelPill"></div>
  </div>
  <div id="devPanelTitle">
    <span>Dev Options</span>
    <button onclick="toggleDevPanel()">✕</button>
  </div>

  <!-- Live stats row -->
  <div id="devStats">
    <div class="dev-stat"><span class="dev-stat-label">Heading</span><span class="dev-stat-val" id="hdg">—</span>°</div>
    <div class="dev-stat"><span class="dev-stat-label">Steps</span><span class="dev-stat-val" id="stepCount">0</span></div>
    <div class="dev-stat"><span class="dev-stat-label">Status</span><span class="dev-stat-val" id="status">—</span></div>
  </div>

  <div class="dev-divider"></div>

  <!-- Step length slider -->
  <div class="dev-slider-block">
    <div class="dev-slider-header">
      <span class="dev-slider-label">Step length</span>
      <span class="dev-slider-value" id="slVal">0.025 m</span>
    </div>
    <input class="dev-slider" type="range" min="0.005" max="0.12" step="0.005" value="0.025"
      oninput="window.STEP_LENGTH=parseFloat(this.value);
               document.getElementById('slVal').textContent=parseFloat(this.value).toFixed(3)+' m'">
    <div class="dev-slider-hint">Larger = more distance per step detected</div>
  </div>

  <!-- Step threshold slider -->
  <div class="dev-slider-block">
    <div class="dev-slider-header">
      <span class="dev-slider-label">Step threshold</span>
      <span class="dev-slider-value" id="thVal">1.2</span>
    </div>
    <input class="dev-slider" type="range" min="0.3" max="4.0" step="0.1" value="1.2"
      oninput="window.STEP_THRESH=parseFloat(this.value);
               document.getElementById('thVal').textContent=this.value">
    <div class="dev-slider-hint">Raise to ignore marching in place</div>
  </div>

  <div class="dev-divider"></div>

  <!-- Status pills + GPS toggle -->
  <div class="dev-bottom-row">
    <div class="pills" style="flex:1">
      <div class="pill good"><span class="dot"></span>Kalman</div>
      <div class="pill" id="gpsPill"><span class="dot"></span><span id="gpsLabel">GPS: —</span></div>
      <div class="pill" id="navmeshPill"><span class="dot" style="background:#555"></span>
        <span id="navmeshLabel">Navmesh: —</span></div>
    </div>
    <button class="btn btn-primary" id="gpsBtn" onclick="toggleGPS()">GPS: ON</button>
  </div>
</div>

<!-- ── Libraries ──────────────────────────────────────────────── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

<!-- ── App scripts (order matters) ───────────────────────────── -->
<script src="js/stalls.js"></script>
<script src="js/navgrid.js"></script>
<script src="js/scene.js"></script>
<script src="js/labels.js"></script>
<script src="js/nav.js"></script>
<script src="js/sensors.js"></script>
<script src="js/pathfinder.js"></script>

<!-- ── GLB Loader + CSS2D bootstrap ──────────────────────────── -->
<script>
// CSS2D renderer — overlays DOM labels on Three.js canvas
const css2d = new THREE.CSS2DRenderer();
css2d.setSize(window.innerWidth, window.innerHeight);
css2d.domElement.style.cssText='position:fixed;top:0;left:0;pointer-events:none;z-index:10';
document.body.appendChild(css2d.domElement);
window.addEventListener('resize',()=>css2d.setSize(window.innerWidth,window.innerHeight));

// Patch animate to also render CSS2D
const _origRender=renderer.render.bind(renderer);
renderer.render=function(s,c){ _origRender(s,c); css2d.render(s,c); };

// Init labels after stall data available
initLabels();

// Load GLB
function setLoad(p,m){
  document.getElementById('loadFill').style.width=p+'%';
  document.getElementById('loadMsg').textContent=m;
}

new THREE.GLTFLoader().load('models/site.glb', gltf=>{
  setLoad(90,'Building navmesh…');
  gltf.scene.traverse(obj=>{
    if(!obj.isMesh)return;
    obj.castShadow=obj.receiveShadow=true;
    if(obj.name==='NAV_MESH') obj.visible=false;
  });
  scene.add(gltf.scene);
  gltf.scene.traverse(obj=>{
    if(!obj.isMesh||obj.name!=='NAV_MESH')return;
    obj.updateWorldMatrix(true,false);
    buildNavmesh(obj);
    document.getElementById('navmeshLabel').textContent=`Navmesh: ${navTriangles.length} tris`;
    document.getElementById('navmeshPill').querySelector('.dot').style.background='#1D9E75';
    // Place avatar at aisle center
    const candidates=[[1.86,0.009],[1.5,0.0],[2.0,0.5],[1.8,-0.5],[1.0,0.0]];
    for(const[cx,cz] of candidates){
      const tri=findTri(cx,cz);
      if(tri){placeAvatarImmediate(cx,triY(cx,cz,tri.a,tri.b,tri.c),cz);break;}
    }
  });
  setLoad(100,'Ready!');
  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('status').textContent='tap Start tracking';
  },300);
},
xhr=>{if(xhr.total)setLoad(Math.round(xhr.loaded/xhr.total*85),`Loading… ${(xhr.loaded/1024/1024).toFixed(1)}MB`);},
err=>{
  document.getElementById('loading').style.display='none';
  showErr('Could not load models/site.glb — place it in models/ folder. '+err.message);
});

animate(); // start render loop after all scripts and patches are ready

function toggleDevPanel(){
  document.getElementById('devPanel').classList.toggle('open');
}

function showErr(msg){
  const el=document.getElementById('errBox');
  el.textContent=msg;el.style.display='block';
  document.getElementById('status').textContent='error';
  setTimeout(()=>el.style.display='none',8000);
}
</script>
</body>
</html>
