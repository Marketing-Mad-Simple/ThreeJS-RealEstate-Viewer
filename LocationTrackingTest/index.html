<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Convention Center Tracker</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#111;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #three-canvas{position:fixed;inset:0;width:100%!important;height:100%!important}

    #hud{
      position:fixed;bottom:0;left:0;right:0;
      padding:12px 14px 22px;
      background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,0));
      display:flex;flex-direction:column;gap:8px;pointer-events:none;
    }
    #hud>*{pointer-events:auto}
    .hud-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .btn{padding:11px 18px;border-radius:10px;border:none;font-size:14px;
      font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .btn-primary{background:rgba(255,255,255,.15);color:#fff}
    .btn-active {background:#1D9E75;color:#fff}
    .btn-danger {background:#E24B4A;color:#fff}
    .btn-off    {background:rgba(255,255,255,.08);color:#666}
    .pills{display:flex;gap:6px;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;
      padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.1);color:#ccc;}
    .pill .dot{width:7px;height:7px;border-radius:50%;background:#555;flex-shrink:0}
    .pill.good{background:rgba(29,158,117,.25);color:#5eefc0} .pill.good .dot{background:#1D9E75}
    .pill.poor{background:rgba(250,140,22,.2) ;color:#ffc069} .pill.poor .dot{background:#fa8c16}
    .pill.off2{background:rgba(255,255,255,.06);color:#555}   .pill.off2 .dot{background:#333}
    .stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#aaa}
    .stats span{color:#fff;font-weight:500}
    #speedBar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);
      overflow:hidden;width:100%;max-width:300px}
    #speedFill{height:100%;width:0%;background:#1D9E75;transition:width .08s}
    .slider-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#aaa;flex-wrap:wrap}
    .slider-row input{flex:1;max-width:140px;accent-color:#1D9E75}
    #loading{position:fixed;inset:0;background:#111;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:16px;color:#fff;font-size:15px;z-index:999;}
    #loadBar{width:220px;height:4px;border-radius:2px;background:#333;overflow:hidden}
    #loadFill{height:100%;width:0%;background:#1D9E75;transition:width .3s}
    #loadMsg{color:#aaa;font-size:13px}
    #errBox{display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);
      background:#5a0000;color:#ffaaaa;padding:10px 16px;border-radius:8px;
      font-size:13px;z-index:1000;max-width:90vw;text-align:center;}
    #compass{position:fixed;top:14px;right:14px;width:44px;height:44px;
      background:rgba(0,0,0,.6);border-radius:50%;display:flex;
      align-items:center;justify-content:center;font-size:20px;
      pointer-events:none;backdrop-filter:blur(6px);}
    #recenterBtn{position:fixed;top:14px;left:14px;padding:8px 12px;border-radius:8px;
      border:none;background:rgba(0,0,0,.6);color:#fff;font-size:13px;
      cursor:pointer;backdrop-filter:blur(6px);}
  </style>
</head>
<body>

<div id="loading">
  <div style="font-size:20px;font-weight:600">Convention Tracker</div>
  <div id="loadBar"><div id="loadFill"></div></div>
  <div id="loadMsg">Loading scene…</div>
</div>

<canvas id="three-canvas"></canvas>
<button id="recenterBtn" onclick="recenterCamera()">⊙ Reset zoom</button>
<div id="compass">⬆</div>
<div id="errBox"></div>

<div id="hud">
  <div class="pills">
    <div class="pill good"><span class="dot"></span>Continuous step + Kalman heading</div>
    <div class="pill" id="gpsPill"><span class="dot"></span><span id="gpsLabel">GPS: —</span></div>
    <div class="pill" id="navPill"><span class="dot" style="background:#555"></span>
      <span id="navLabel">Navmesh: loading</span></div>
  </div>

  <div id="speedBar"><div id="speedFill"></div></div>

  <div class="stats">
    <div>Heading: <span id="hdg">—</span>°</div>
    <div>Steps: <span id="stepCount">0</span></div>
    <div>Pos: <span id="pos">0, 0</span> m</div>
    <div>Status: <span id="status">loading…</span></div>
  </div>

  <div class="slider-row">
    <span>Step length</span>
    <input type="range" id="slSlider" min="0.005" max="0.12" step="0.005" value="0.025"
      oninput="STEP_LENGTH=parseFloat(this.value);
               STEP_LENGTH=parseFloat(this.value);document.getElementById('slVal').textContent=parseFloat(this.value).toFixed(2)+'m'">
    <span id="slVal">0.025m</span>
  </div>
  <div class="slider-row">
    <span>Step threshold</span>
    <input type="range" id="thSlider" min="0.3" max="4.0" step="0.1" value="1.2"
      oninput="STEP_THRESH=parseFloat(this.value);
               document.getElementById('thVal').textContent=this.value">
    <span id="thVal">1.2</span>
    <span style="color:#555;font-size:11px">— lower if steps not detected</span>
  </div>
  <div class="slider-row">
    <span>Still filter</span>
    <input type="range" id="horizSlider" min="0.05" max="1.5" step="0.05" value="0.30"
      oninput="HORIZ_MIN=parseFloat(this.value);
               document.getElementById('horizVal').textContent=this.value">
    <span id="horizVal">0.30</span>
    <span style="color:#555;font-size:11px">— raise = need more consecutive steps before moving</span>
  </div>

  <div class="hud-row">
    <button class="btn btn-primary" id="startBtn" onclick="requestAndStart()">Start tracking</button>
    <button class="btn btn-primary" id="moveBtn"  onclick="toggleMove()" style="display:none">Walking: OFF</button>
    <button class="btn btn-primary" id="gpsBtn"   onclick="toggleGPS()"  style="display:none">GPS: ON</button>
    <button class="btn btn-danger"  id="resetBtn" onclick="reset()"      style="display:none">Reset</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
'use strict';

// ─── Tuning ────────────────────────────────────────────────────────────────
let STEP_LENGTH = 0.025;
let STEP_THRESH = 1.2;
const STEP_MIN_MS  = 220;
const GPS_TRUST    = 25;
const GPS_BLEND    = 0.25;
const GPS_WORLD_SCALE = 0.19; // real metres → GLB world units (tune if GPS drift feels wrong)
const GPS_GAP_MS   = 4000;
const GPS_JUMP_MAX = 1.0; // map is only 4.4x6.2 units — cap corrections at 1 unit

// Smooth movement: each step pushes a target position,
// avatar glides toward it every animation frame.
const MOVE_SMOOTH = 0.18; // lerp factor per frame toward target (higher = snappier)

// ─── Renderer ──────────────────────────────────────────────────────────────
const canvas   = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding    = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x18181f);
scene.fog = new THREE.Fog(0x18181f, 6, 20);

const camera = new THREE.PerspectiveCamera(60, 1, 0.005, 100);
let camFollowing = true; // always true in top-down mode
const camOffset  = new THREE.Vector3(0, 2.2, 0.6); // isometric: mostly up, slight tilt

// ─── Lighting ──────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xfff5e0, 0.9));
const sun = new THREE.DirectionalLight(0xffe8c0, 0.8);
sun.position.set(20, 40, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-60; sun.shadow.camera.right=60;
sun.shadow.camera.bottom=-60; sun.shadow.camera.top=60;
sun.shadow.camera.far=300;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5);
fill.position.set(0, 10, 0); scene.add(fill);
const fill2 = new THREE.DirectionalLight(0xaaccff, 0.3);
fill2.position.set(-8, 6, -8); scene.add(fill2);

// ─── Avatar ────────────────────────────────────────────────────────────────
// Larger, clearer direction indicator.
// Structure:
//   avatarRoot  (world position + Y rotation)
//   ├─ body     fat cylinder
//   ├─ capT/capB hemisphere caps
//   ├─ dirGroup (rotated so +Z = forward)
//   │  ├─ beak  flat forward wedge (main direction cue)
//   │  └─ frontStripe  colored stripe on front face
//   └─ groundPlane  large flat disc with direction arrow painted on it

const avatarRoot = new THREE.Object3D();
scene.add(avatarRoot);

// Body — bigger radius, taller
const BODY_R = 0.028;
const BODY_H = 0.065;
const avatarMat = new THREE.MeshStandardMaterial({
  color: 0x1D9E75, emissive: 0x0d3d2a, roughness: 0.35, metalness: 0.15
});
const body = new THREE.Mesh(new THREE.CylinderGeometry(BODY_R, BODY_R, BODY_H, 24), avatarMat);
body.castShadow = true;
avatarRoot.add(body);

const capMat = new THREE.MeshStandardMaterial({
  color: 0x17c485, emissive: 0x082e1e, roughness: 0.3, metalness: 0.1
});
const capT = new THREE.Mesh(new THREE.SphereGeometry(BODY_R, 24, 12), capMat);
capT.position.y = BODY_H / 2; avatarRoot.add(capT);
const capB = new THREE.Mesh(new THREE.SphereGeometry(BODY_R, 24, 12), capMat);
capB.position.y = -BODY_H / 2; avatarRoot.add(capB);

// ── Direction indicator: bold forward fin/beak ──────────────────────────
// A flat elongated tetrahedron-style "beak" sticking forward
const beakMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0xaaaaaa, roughness: 0.2, metalness: 0.3,
  side: THREE.DoubleSide
});

// Beak: a wide flat triangle pointing forward (+Z in local space)
const beakGeo = new THREE.BufferGeometry();
const beakVerts = new Float32Array([
  // front tip
   0,    0,    BODY_R * 3.5,
  // back left
  -BODY_R * 1.2, 0, BODY_R * 0.3,
  // back right
   BODY_R * 1.2, 0, BODY_R * 0.3,
  // top center back
   0, BODY_R * 0.8, BODY_R * 0.3,
]);
const beakIdx = new Uint16Array([
  0,1,2,  // bottom face
  0,2,3,  // right face
  0,3,1,  // left face
  1,3,2,  // back face
]);
beakGeo.setAttribute('position', new THREE.BufferAttribute(beakVerts, 3));
beakGeo.setIndex(new THREE.BufferAttribute(beakIdx, 1));
beakGeo.computeVertexNormals();
const beak = new THREE.Mesh(beakGeo, beakMat);
beak.position.y = 0.12;
avatarRoot.add(beak);

// ── Ground disc with direction arrow ───────────────────────────────────
// Outer glow ring
const ringMat = new THREE.MeshBasicMaterial({
  color: 0x1D9E75, side: THREE.DoubleSide, transparent: true, opacity: 0.55
});
const ring = new THREE.Mesh(new THREE.RingGeometry(BODY_R * 1.3, BODY_R * 2.2, 40), ringMat);
ring.rotation.x = -Math.PI / 2;
ring.position.y = -BODY_H / 2 + 0.005;
avatarRoot.add(ring);

// Direction arrow on ground — a flat triangle pointing forward
const arrowGndMat = new THREE.MeshBasicMaterial({
  color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9
});
const arrowGndGeo = new THREE.BufferGeometry();
const agv = new Float32Array([
   0,    0,  BODY_R * 3.5,   // tip (forward = +Z)
  -BODY_R * 0.8, 0,  BODY_R * 1.2,
   BODY_R * 0.8, 0,  BODY_R * 1.2,
]);
arrowGndGeo.setAttribute('position', new THREE.BufferAttribute(agv, 3));
arrowGndGeo.setIndex(new THREE.BufferAttribute(new Uint16Array([0,2,1]), 1));
arrowGndGeo.computeVertexNormals();
const arrowGnd = new THREE.Mesh(arrowGndGeo, arrowGndMat);
arrowGnd.rotation.x = -Math.PI / 2;
arrowGnd.position.y = -BODY_H / 2 + 0.006;
avatarRoot.add(arrowGnd);

// Bright forward stripe on the body surface
const stripeMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0xcccccc, roughness: 0.1, metalness: 0.5
});
const stripeGeo = new THREE.CylinderGeometry(BODY_R + 0.005, BODY_R + 0.005, BODY_H * 0.55, 6, 1, true,
  -Math.PI * 0.1, Math.PI * 0.2); // partial arc on front
const stripe = new THREE.Mesh(stripeGeo, stripeMat);
avatarRoot.add(stripe);

// ─── Avatar position & target ──────────────────────────────────────────────
// "actual" position (what's rendered) vs "target" position (where next step lands)
// Each frame we lerp actual → target for smooth gliding movement
let aX = 0, aY = 0, aZ = 0;       // current rendered position
let tX = 0, tY = 0, tZ = 0;       // target position (set on each step)
let aHeading = 0, tHeading = 0;    // current / target heading (degrees)
const AVATAR_HOVER = 0.04;         // float height above navmesh (= half body height + cap)

function placeAvatarImmediate(x, y, z) {
  aX=x; aY=y; aZ=z; tX=x; tY=y; tZ=z;
  avatarRoot.position.set(x, y + AVATAR_HOVER, z);
}

// ─── Resize ────────────────────────────────────────────────────────────────
function onResize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize); onResize();

// ─── Navmesh ───────────────────────────────────────────────────────────────
let navTriangles = [], navReady = false;

function buildNavmesh(mesh) {
  const geo    = mesh.geometry.clone();
  geo.applyMatrix4(mesh.matrixWorld);
  const pos    = geo.attributes.position;
  const idxArr = geo.index ? geo.index.array : null;
  const triCount = idxArr ? idxArr.length / 3 : pos.count / 3;
  navTriangles = [];
  for (let t = 0; t < triCount; t++) {
    const i0 = idxArr ? idxArr[t*3]   : t*3;
    const i1 = idxArr ? idxArr[t*3+1] : t*3+1;
    const i2 = idxArr ? idxArr[t*3+2] : t*3+2;
    const a = new THREE.Vector3(pos.getX(i0), pos.getY(i0), pos.getZ(i0));
    const b = new THREE.Vector3(pos.getX(i1), pos.getY(i1), pos.getZ(i1));
    const c = new THREE.Vector3(pos.getX(i2), pos.getY(i2), pos.getZ(i2));
    navTriangles.push({ a, b, c,
      minX:Math.min(a.x,b.x,c.x), maxX:Math.max(a.x,b.x,c.x),
      minZ:Math.min(a.z,b.z,c.z), maxZ:Math.max(a.z,b.z,c.z) });
  }
  document.getElementById('navLabel').textContent = `Navmesh: ${navTriangles.length} tris`;
  document.getElementById('navPill').querySelector('.dot').style.background = '#1D9E75';
  navReady = true;
}

function _sign(p1x,p1z,p2x,p2z,p3x,p3z){ return(p1x-p3x)*(p2z-p3z)-(p2x-p3x)*(p1z-p3z); }
function ptInTri(px,pz,a,b,c){
  const d1=_sign(px,pz,a.x,a.z,b.x,b.z), d2=_sign(px,pz,b.x,b.z,c.x,c.z), d3=_sign(px,pz,c.x,c.z,a.x,a.z);
  return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));
}
function triY(px,pz,a,b,c){
  const v0x=c.x-a.x,v0z=c.z-a.z,v1x=b.x-a.x,v1z=b.z-a.z,v2x=px-a.x,v2z=pz-a.z;
  const d00=v0x*v0x+v0z*v0z,d01=v0x*v1x+v0z*v1z,d02=v0x*v2x+v0z*v2z;
  const d11=v1x*v1x+v1z*v1z,d12=v1x*v2x+v1z*v2z;
  const inv=1/(d00*d11-d01*d01);
  const u=(d11*d02-d01*d12)*inv, v=(d00*d12-d01*d02)*inv;
  return a.y+v*(b.y-a.y)+u*(c.y-a.y);
}
function findTri(px,pz){
  for(const t of navTriangles){
    if(px<t.minX||px>t.maxX||pz<t.minZ||pz>t.maxZ) continue;
    if(ptInTri(px,pz,t.a,t.b,t.c)) return t;
  }
  return null;
}
function constrain(ox,oz,nx,nz){
  if(!navReady) return{x:nx,z:nz,y:aY};
  let t;
  t=findTri(nx,nz); if(t) return{x:nx,z:nz,y:triY(nx,nz,t.a,t.b,t.c)};
  t=findTri(nx,oz); if(t) return{x:nx,z:oz,y:triY(nx,oz,t.a,t.b,t.c)};
  t=findTri(ox,nz); if(t) return{x:ox,z:nz,y:triY(ox,nz,t.a,t.b,t.c)};
  t=findTri(ox,oz); return{x:ox,z:oz,y:t?triY(ox,oz,t.a,t.b,t.c):aY};
}

// ─── Load GLB ──────────────────────────────────────────────────────────────
function setLoad(p,m){
  document.getElementById('loadFill').style.width=p+'%';
  document.getElementById('loadMsg').textContent=m;
}

new THREE.GLTFLoader().load('models/site.glb', gltf => {
  setLoad(90, 'Building navmesh…');
  gltf.scene.traverse(obj => {
    if (!obj.isMesh) return;
    obj.castShadow = obj.receiveShadow = true;
    if (obj.name === 'NAV_MESH') obj.visible = false;
  });
  scene.add(gltf.scene);
  gltf.scene.traverse(obj => {
    if (!obj.isMesh || obj.name !== 'NAV_MESH') return;
    obj.updateWorldMatrix(true, false);
    buildNavmesh(obj);
    if (navTriangles.length) {
      // Use known navmesh center (1.86, 0.02, 0.009) — aisles are widest here
      const candidates = [
        [1.86, 0.009], [1.5, 0.0], [2.0, 0.5], [1.8, -0.5], [1.0, 0.0]
      ];
      let placed = false;
      for (const [cx, cz] of candidates) {
        const tri = findTri(cx, cz);
        if (tri) { placeAvatarImmediate(cx, triY(cx,cz,tri.a,tri.b,tri.c), cz); placed=true; break; }
      }
      if (!placed) {
        const mid = navTriangles[Math.floor(navTriangles.length/2)];
        const sx=(mid.a.x+mid.b.x+mid.c.x)/3, sz=(mid.a.z+mid.b.z+mid.c.z)/3;
        placeAvatarImmediate(sx, mid.a.y, sz);
      }
    }
  });
  setLoad(100,'Ready!');
  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('status').textContent='tap Start tracking';
  },400);
},
xhr=>{ if(xhr.total) setLoad(Math.round(xhr.loaded/xhr.total*85),`Loading… ${(xhr.loaded/1024/1024).toFixed(1)} MB`); },
err=>{ document.getElementById('loading').style.display='none'; showErr('Could not load models/site.glb — place it in models/ folder next to this HTML — '+err.message); }
);

// ─── Kalman (heading) ──────────────────────────────────────────────────────
let compassHeading=0;
let kAngle=0,kBias=0,kP00=1,kP01=0,kP10=0,kP11=1;
function kalman(newC,gyroRate,dt){
  const rate=gyroRate-kBias; kAngle+=dt*rate;
  kP00+=dt*(dt*kP11-kP01-kP10+0.001); kP01-=dt*kP11; kP10-=dt*kP11; kP11+=0.003*dt;
  let d=newC-kAngle; if(d>180)d-=360; if(d<-180)d+=360;
  const S=kP00+0.5,K0=kP00/S,K1=kP10/S;
  kAngle+=K0*d; kBias+=K1*d;
  kP00-=K0*kP00; kP01-=K0*kP01; kP10-=K1*kP00; kP11-=K1*kP01;
  kAngle=((kAngle%360)+360)%360; return kAngle;
}

// ─── Step detection ────────────────────────────────────────────────────────
let magLP=9.81, stepPhase='seek_peak', stepCount=0, lastStepMs=0;

// Anti-marching-in-place:
// Track gravity estimate (low-pass) and horizontal residual (high-pass).
// Real walking = horizontal accel burst aligns with heading direction.
// Marching in place = mostly vertical bounce, tiny horizontal component.
let gravXlp=0, gravYlp=0, gravZlp=9.81;  // low-pass gravity estimate
let horizMagLP=0;                          // smoothed horizontal accel magnitude
let HORIZ_MIN = 0.30; // m/s² — minimum horizontal movement to count a step
                        // lower = more sensitive to slow walks, raise to filter marching

// Heading history for consistency check
let lastStepHeadings = []; // last 3 step headings (radians)
const MAX_HEADING_VARIANCE_DEG = 45; // if last steps vary more than this, likely marching

// Smooth step velocity:
// Instead of teleporting on each step, we accumulate a velocity vector
// that decays over time — gives continuous gliding between steps.
let velX=0, velZ=0;
const VEL_STEP_DECAY = 0.70; // per-frame decay — higher = slides longer, lower = stops faster

// ─── Sensor state ──────────────────────────────────────────────────────────
let lastMotionT=null, isMoving=false, started=false;
let currentHeadingRad=0; // always updated from Kalman, even when not walking

function onOrientation(e){
  if(typeof e.webkitCompassHeading==='number') compassHeading=e.webkitCompassHeading;
  else if(e.alpha!=null) compassHeading=(360-e.alpha)%360;
}

function onMotion(e){
  if(!started) return;
  const now=Date.now();
  if(!lastMotionT){lastMotionT=now;return;}
  const dt=Math.min((now-lastMotionT)/1000,0.1);
  lastMotionT=now;

  // Kalman heading
  const rr=e.rotationRate;
  const gyroYaw=(rr&&rr.alpha!=null)?rr.alpha:0;
  const heading=kalman(compassHeading,gyroYaw,dt);
  currentHeadingRad=heading*Math.PI/180;
  document.getElementById('hdg').textContent=Math.round(heading);
  document.getElementById('compass').style.transform=`rotate(${-heading}deg)`;

  // Step detection from |aig| magnitude + horizontal movement filter
  const aig=e.accelerationIncludingGravity;
  if(!aig||aig.x===null) return;

  // Total magnitude (orientation-independent bounce detection)
  const mag=Math.sqrt(aig.x*aig.x+aig.y*aig.y+aig.z*aig.z);
  magLP=0.93*magLP+0.07*mag;
  const dev=mag-magLP;

  if(stepPhase==='seek_peak'){
    if(dev > STEP_THRESH){

      // Dynamic minimum gap between steps — controlled by still-filter slider
      // slider 0.05→220ms, 0.30→420ms, 1.5→1200ms
      const minGap = 220 + HORIZ_MIN * 650;

      if(now - lastStepMs > minGap){
        stepCount++;
        lastStepMs = now;
        lastStepTs = now;
        document.getElementById('stepCount').textContent = stepCount;

        if(isMoving){
          // Set a new target position one step ahead, constrained to navmesh
          const dx = Math.sin(currentHeadingRad) * STEP_LENGTH;
          const dz = -Math.cos(currentHeadingRad) * STEP_LENGTH;
          const r  = constrain(aX, aZ, aX + dx, aZ + dz);
          tX = r.x; tZ = r.z; tY = r.y;
        }
      }
      stepPhase='seek_valley';
    }
  } else {
    if(dev < -STEP_THRESH * 0.5) stepPhase = 'seek_peak';
  }
}

// ─── GPS ───────────────────────────────────────────────────────────────────
let gpsEnabled=true,originLat=null,originLng=null;
let gpsWX=null,gpsWZ=null,gpsAcc=Infinity,lastGpsCorr=0;

function latLngToM(lat,lng,oLat,oLng){
  const R=6371000,dLat=(lat-oLat)*Math.PI/180,dLng=(lng-oLng)*Math.PI/180;
  const mid=((lat+oLat)/2)*Math.PI/180;
  return{x:dLng*R*Math.cos(mid)*GPS_WORLD_SCALE, z:-dLat*R*GPS_WORLD_SCALE};
}
function onGPS(pos){
  const{latitude,longitude,accuracy}=pos.coords; gpsAcc=accuracy;
  if(originLat===null){originLat=latitude;originLng=longitude;gpsWX=aX;gpsWZ=aZ;}
  else{const m=latLngToM(latitude,longitude,originLat,originLng);gpsWX=aX+m.x;gpsWZ=aZ+m.z;}
  const pill=document.getElementById('gpsPill'),lbl=document.getElementById('gpsLabel');
  if(!gpsEnabled){pill.className='pill off2';lbl.textContent='GPS: off';return;}
  pill.className=accuracy<GPS_TRUST?'pill good':'pill poor';
  lbl.textContent=`GPS ±${Math.round(accuracy)}m${accuracy<GPS_TRUST?' ✓':' (noisy)'}`;
  const now=Date.now();
  if(gpsEnabled&&accuracy<GPS_TRUST&&now-lastGpsCorr>GPS_GAP_MS){
    const dx=gpsWX-aX,dz=gpsWZ-aZ,jump=Math.hypot(dx,dz);
    if(jump<GPS_JUMP_MAX){
      const tx=aX+GPS_BLEND*dx,tz=aZ+GPS_BLEND*dz;
      const tri=findTri(tx,tz);
      if(tri){
        tX=tx; tZ=tz; tY=triY(tx,tz,tri.a,tri.b,tri.c);
        lastGpsCorr=now;
      }
    }
  }
}
function onGPSError(e){
  document.getElementById('gpsPill').className='pill poor';
  document.getElementById('gpsLabel').textContent=
    ({1:'Location denied',2:'GPS unavailable',3:'GPS timeout'})[e.code]||'GPS error';
}
function startGPS(){
  if(!navigator.geolocation){document.getElementById('gpsLabel').textContent='GPS unsupported';return;}
  document.getElementById('gpsLabel').textContent='GPS: acquiring…';
  const opt={enableHighAccuracy:true,maximumAge:2000,timeout:15000};
  navigator.geolocation.getCurrentPosition(
    p=>{onGPS(p);navigator.geolocation.watchPosition(onGPS,onGPSError,opt);},
    e=>{onGPSError(e);navigator.geolocation.watchPosition(onGPS,onGPSError,{...opt,timeout:20000});},
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}
function toggleGPS(){
  gpsEnabled=!gpsEnabled;
  document.getElementById('gpsBtn').textContent='GPS: '+(gpsEnabled?'ON':'OFF');
  document.getElementById('gpsBtn').className=gpsEnabled?'btn btn-primary':'btn btn-off';
  if(!gpsEnabled){document.getElementById('gpsPill').className='pill off2';document.getElementById('gpsLabel').textContent='GPS: off';}
}

// ─── Camera ────────────────────────────────────────────────────────────────
const camTarget=new THREE.Vector3();
function recenterCamera(){ camOffset.y=2.2; camOffset.z=0.6; } // reset zoom
function updateCamera(){
  // Always follow avatar — isometric top-down, no orbit drift
  camTarget.set(aX, aY, aZ);
  const desired = new THREE.Vector3(aX + camOffset.x, aY + camOffset.y, aZ + camOffset.z);
  camera.position.lerp(desired, 0.12);
  camera.lookAt(camTarget);
}

let orbitActive=false,orbitSX=0,orbitSY=0;
const c3=document.getElementById('three-canvas');
c3.addEventListener('mousedown',e=>{if(e.target!==c3)return;orbitActive=true;camFollowing=false;orbitSX=e.clientX;orbitSY=e.clientY;});
window.addEventListener('mouseup',()=>orbitActive=false);
window.addEventListener('mousemove',e=>{
  if(!orbitActive)return;
  const dx=(e.clientX-orbitSX)*0.01,dy=(e.clientY-orbitSY)*0.01;
  orbitSX=e.clientX;orbitSY=e.clientY;
  const len=Math.sqrt(camOffset.x**2+camOffset.z**2);
  const angle=Math.atan2(camOffset.x,camOffset.z)+dx;
  camOffset.x=Math.sin(angle)*len; camOffset.z=Math.cos(angle)*len;
  camOffset.y=Math.max(0.3,Math.min(10,camOffset.y-dy*2));
});
c3.addEventListener('wheel',e=>{
  e.preventDefault();
  camOffset.multiplyScalar(e.deltaY<0?0.85:1.18);
  if(camOffset.length()<0.4)camOffset.setLength(0.4);
  if(camOffset.length()>12)camOffset.setLength(12);
},{passive:false});
let tOrbit=false,tOX=0,tOY=0;
c3.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;tOrbit=true;camFollowing=false;tOX=e.touches[0].clientX;tOY=e.touches[0].clientY;},{passive:true});
c3.addEventListener('touchmove',e=>{
  if(!tOrbit||e.touches.length!==1)return;
  const dx=(e.touches[0].clientX-tOX)*0.008,dy=(e.touches[0].clientY-tOY)*0.008;
  tOX=e.touches[0].clientX;tOY=e.touches[0].clientY;
  const len=Math.sqrt(camOffset.x**2+camOffset.z**2);
  const angle=Math.atan2(camOffset.x,camOffset.z)+dx;
  camOffset.x=Math.sin(angle)*len; camOffset.z=Math.cos(angle)*len;
  camOffset.y=Math.max(0.3,Math.min(10,camOffset.y-dy*2));
},{passive:true});
c3.addEventListener('touchend',()=>tOrbit=false,{passive:true});

// ─── Render / update loop ──────────────────────────────────────────────────
let pulse=0;

function animate(){
  requestAnimationFrame(animate);

  // ── Continuous smooth movement ──────────────────────────────────────
  // Decay velocity each frame and move target along it
  // Speed bar: show distance from current pos to target
  const distToTarget = Math.sqrt((tX-aX)**2+(tZ-aZ)**2);
  document.getElementById('speedFill').style.width=Math.min(distToTarget/STEP_LENGTH,1)*100+'%';

  // Lerp actual position → target (smooth glide)
  aX+=(tX-aX)*MOVE_SMOOTH;
  aY+=(tY-aY)*MOVE_SMOOTH;
  aZ+=(tZ-aZ)*MOVE_SMOOTH;
  avatarRoot.position.set(aX, aY+AVATAR_HOVER, aZ);

  // Smooth heading rotation (shortest path)
  let dH=tHeading-aHeading;
  if(dH>Math.PI) dH-=Math.PI*2;
  if(dH<-Math.PI)dH+=Math.PI*2;
  aHeading+=dH*0.15;
  avatarRoot.rotation.y=aHeading;

  // Update target heading from sensor
  // negate because Three +Y rotation is counter-clockwise, compass is clockwise
  // +PI because beak geometry points +Z, but heading 0=north maps to -Z in Three.js
  tHeading = Math.PI - currentHeadingRad;

  // Pulse ring
  pulse+=0.045;
  const pScale=1+0.12*Math.sin(pulse);
  ring.scale.set(pScale,1,pScale);
  ring.material.opacity=0.4+0.2*Math.sin(pulse);

  // Avatar color by state
  const moving=isMoving&&distToTarget>0.002;
  avatarMat.color.setHex(moving?0x1D9E75:0x378ADD);
  avatarMat.emissive.setHex(moving?0x0d3d2a:0x0a1830);
  capMat.color.setHex(moving?0x17c485:0x4a9edd);

  // Update pos display
  document.getElementById('pos').textContent=aX.toFixed(1)+', '+aZ.toFixed(1);

  updateCamera();
  renderer.render(scene,camera);
}
animate();

// ─── Controls ──────────────────────────────────────────────────────────────
async function requestAndStart(){
  document.getElementById('status').textContent='requesting permissions…';
  try{
    if(typeof DeviceOrientationEvent?.requestPermission==='function'){
      if(await DeviceOrientationEvent.requestPermission()!=='granted'){
        showErr('Orientation denied — Settings → Safari → Motion & Orientation Access');return;
      }
    }
    if(typeof DeviceMotionEvent?.requestPermission==='function'){
      if(await DeviceMotionEvent.requestPermission()!=='granted'){
        showErr('Motion denied — Settings → Safari → Motion & Orientation Access');return;
      }
    }
    window.addEventListener('deviceorientation',onOrientation,true);
    window.addEventListener('devicemotion',onMotion,true);
    startGPS();
    started=true; kAngle=0; kBias=0;
    document.getElementById('startBtn').style.display='none';
    document.getElementById('moveBtn').style.display='';
    document.getElementById('gpsBtn').style.display='';
    document.getElementById('resetBtn').style.display='';
    document.getElementById('status').textContent='ready — tap Walking when moving';
  }catch(err){showErr('Error: '+err.message);}
}

function toggleMove(){
  isMoving=!isMoving;
  if(!isMoving){velX=0;velZ=0;} // stop gliding when user turns off walking
  document.getElementById('moveBtn').textContent='Walking: '+(isMoving?'ON':'OFF');
  document.getElementById('moveBtn').className=isMoving?'btn btn-active':'btn btn-primary';
  document.getElementById('status').textContent=isMoving?'tracking steps':'stationary';
}

function reset(){
  isMoving=false; lastMotionT=null; velX=0; velZ=0; lastStepTs=0;
  stepCount=0; stepPhase='seek_peak'; magLP=9.81; lastStepTs=0;
  kAngle=0;kBias=0;kP00=1;kP01=0;kP10=0;kP11=1;
  currentHeadingRad=0; aHeading=Math.PI; tHeading=Math.PI;
  originLat=null;originLng=null;gpsWX=null;gpsWZ=null;gpsAcc=Infinity;lastGpsCorr=0;
  if(navTriangles.length){
    const candidates=[[1.86,0.009],[1.5,0.0],[2.0,0.5],[1.8,-0.5],[1.0,0.0]];
    let placed=false;
    for(const[cx,cz] of candidates){const tri=findTri(cx,cz);if(tri){placeAvatarImmediate(cx,triY(cx,cz,tri.a,tri.b,tri.c),cz);placed=true;break;}}
    if(!placed){const mid=navTriangles[Math.floor(navTriangles.length/2)];placeAvatarImmediate((mid.a.x+mid.b.x+mid.c.x)/3,mid.a.y,(mid.a.z+mid.b.z+mid.c.z)/3);}
  }
  camFollowing=true;
  document.getElementById('moveBtn').textContent='Walking: OFF';
  document.getElementById('moveBtn').className='btn btn-primary';
  document.getElementById('status').textContent='reset — ready';
  document.getElementById('pos').textContent='0, 0';
  document.getElementById('stepCount').textContent='0';
  document.getElementById('speedFill').style.width='0%';
  document.getElementById('gpsPill').className='pill';
  document.getElementById('gpsLabel').textContent='GPS: re-acquiring…';
}

function showErr(msg){
  const el=document.getElementById('errBox');
  el.textContent=msg; el.style.display='block';
  document.getElementById('status').textContent='error';
  setTimeout(()=>el.style.display='none',8000);
}
</script>
